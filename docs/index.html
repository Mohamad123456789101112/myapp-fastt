    <script>
      // Explicitly set Tailwind's dark mode strategy to 'class'
      // This ensures the theme is controlled by the class on the <html> tag,
      // not the user's OS preference.
      tailwind.config = {
        darkMode: 'class'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .font-ar {
        font-family: 'Cairo', sans-serif;
      }
      .font-en {
        font-family: 'Poppins', sans-serif;
      }
      .gradient-btn {
        background-image: linear-gradient(to right, #4f46e5, #7c3aed);
        transition: all 0.3s ease;
      }
      .gradient-btn:hover {
        background-image: linear-gradient(to right, #4338ca, #6d28d9);
        box-shadow: 0 10px 20px -10px rgba(79, 70, 229, 0.5);
        transform: translateY(-2px);
      }
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .theme-animated {
        background: linear-gradient(-45deg, #4f46e5, #ec4899, #f59e0b, #10b981);
        background-size: 400% 400%;
        animation: gradient 20s ease infinite;
      }
      /* Page & component animations */
      @keyframes page-fade-in {
        from { opacity: 0; transform: translateY(1rem); }
        to { opacity: 1; transform: translateY(0); }
      }
      .page-container {
        animation: page-fade-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      }
      @keyframes card-fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .product-card-enter {
        animation: card-fade-in-up 0.6s ease-out forwards;
        opacity: 0;
      }
      
      /* Profile Glow Animation */
      @keyframes glow {
        0%, 100% {
          box-shadow: 0 0 5px rgba(99, 102, 241, 0.4), 0 0 10px rgba(99, 102, 241, 0.3), 0 0 2px #fff;
        }
        50% {
          box-shadow: 0 0 15px rgba(99, 102, 241, 0.7), 0 0 25px rgba(99, 102, 241, 0.6), 0 0 2px #fff;
        }
      }
      .profile-glow {
        animation: glow 2.5s ease-in-out 3; /* Run animation 3 times */
      }
      
      /* Background Lightning Effect */
      .background-effects {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }
      @keyframes lightning-streak {
        from {
          transform: translate(-50vw, -50vh) rotate(45deg);
          opacity: 0;
        }
        50% {
          opacity: 0.7;
        }
        to {
          transform: translate(50vw, 50vh) rotate(45deg);
          opacity: 0;
        }
      }
      .lightning-bolt {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1px;
        height: 150vh;
        background: linear-gradient(
          transparent,
          rgba(107, 225, 255, 0.8), /* Cyan color */
          transparent
        );
        box-shadow: 0 0 10px rgba(107, 225, 255, 0.8), 0 0 20px rgba(107, 225, 255, 0.5);
        opacity: 0;
        will-change: transform, opacity;
      }
      .lightning-bolt.animate {
        animation: lightning-streak 1s ease-in-out forwards;
      }

    </style>
